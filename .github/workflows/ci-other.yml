name: CI Workflow

permissions:
  id-token: write
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - 'dummy-service/**/*'
      - 'lib/**/*'

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: false

env:
  FORCE_COLOR: 3 # fix terminal color output

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Print GitHub context
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Branch/PR: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Build
        run: echo 0

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build
        run: echo 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build
        run: echo 0

  ci-succeeded:
    name: CI Succeeded
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    steps:
      - name: Echo success
        run: echo 0
